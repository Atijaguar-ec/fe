<app-authorised-layout>
  <app-company-left-panel></app-company-left-panel>

  <div class="main reports-container">
    <div class="af-form-wrapper">
      <div class="reports-tabs-header">
        <div class="reports-tabs-nav">
          <button
            type="button"
            *ngFor="let tab of reportTabs"
            class="reports-tab-button"
            [class.active]="activeSlug === tab.slug"
            (click)="selectTab(tab.slug)"
            [title]="tab.description"
          >
            {{ tab.label }}
          </button>
        </div>
        <a
          *ngIf="studioEnabled"
          class="studio-link-button"
          routerLink="/company-reports/studio"
          i18n="@@companyReports.openStudio"
        >
          Estudio de Reportes
        </a>
      </div>

      <div *ngIf="errorMessage" class="reports-error-banner" role="alert">
        {{ errorMessage }}
      </div>

      <div *ngIf="loadingCatalog || loadingDashboard" class="reports-loading-bar">
        Cargando reporte...
      </div>

      <div class="dashboard-frame-container">
        <div
          class="dashboard-frame-wrapper"
          [class.hidden]="!!errorMessage || reportTabs.length === 0"
        >
          <div #supersetMountPoint class="dashboard-frame"></div>
        </div>
      </div>
    </div>
  </div>
</app-authorised-layout>
