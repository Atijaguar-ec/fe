<app-authorised-layout>
  <app-company-left-panel *ngIf="!focusMode"></app-company-left-panel>

  <div class="main reports-container" [ngClass]="{ 'focus-mode': focusMode }">
    <div class="af-form-wrapper">

      <!-- Executive Header Bar -->
      <div class="reports-header-bar">
        <div class="reports-header-left">
          <h2 class="reports-title" i18n="@@companyReports.title">Reportes &amp; BI</h2>
          <span class="reports-company-badge" *ngIf="companyName">
            {{ companyName }}
          </span>
        </div>

        <div class="reports-header-actions">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm focus-toggle-btn"
            (click)="toggleFocusMode()"
            [title]="focusMode ? 'Restaurar menú lateral' : 'Expandir a pantalla completa'"
          >
            <span *ngIf="!focusMode">⛶ Pantalla completa</span>
            <span *ngIf="focusMode">⮌ Restaurar vista</span>
          </button>
          <button
            *ngIf="supersetBaseUrl"
            type="button"
            class="btn btn-primary btn-sm open-fullscreen-btn"
            (click)="openInSuperset()"
            title="Abrir el reporte en una pestaña independiente sin marcos"
            i18n="@@companyReports.button.openSuperset"
          >
            ↗ Abrir en pestaña completa
          </button>
        </div>
      </div>

      <!-- Direct Help Message (Dismissible) -->
      <div class="auth-notice-bar" *ngIf="showAuthTip">
        <div class="auth-notice-content">
          <span class="auth-notice-icon">💡</span>
          <span class="auth-notice-text">
            Para ver la tabla completa de 26 variables o si el sistema le solicita usuario por primera vez, use <strong>«↗ Abrir en pestaña completa»</strong>.
          </span>
        </div>
        <button type="button" class="btn-close-tip" (click)="dismissAuthTip()" aria-label="Cerrar">×</button>
      </div>

      <!-- Compact Tabs Toolbar -->
      <div class="tabs-toolbar">
        <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-pills report-tabs" (activeIdChange)="selectTab($event)">
          <li *ngFor="let tab of tabs" [ngbNavItem]="tab.id">
            <a ngbNavLink class="report-tab-link">
              <span class="tab-icon">{{ tab.icon }}</span>
              <span class="tab-label">{{ tab.label }}</span>
            </a>
          </li>
        </ul>
        <div class="active-tab-desc" *ngIf="currentTabDescription">
          ℹ️ {{ currentTabDescription }}
        </div>
      </div>

      <!-- High-Visibility Dashboard Iframe -->
      <div class="dashboard-frame-container">
        <div class="dashboard-frame-wrapper" *ngIf="iframeSrc; else noDashboard">
          <iframe
            class="dashboard-frame"
            [src]="iframeSrc"
            frameborder="0"
            allowfullscreen
          ></iframe>
        </div>
        <ng-template #noDashboard>
          <div class="no-dashboard-placeholder">
            <p i18n="@@companyReports.noDashboard">
              Configure la URL de Superset para visualizar los reportes.
            </p>
          </div>
        </ng-template>
      </div>

    </div>
  </div>
</app-authorised-layout>
