<div class="page animate-fade-in-up">
  <div class="page-header">
    <div>
      <h1 class="page-title">📦 Masterizado</h1>
      <p class="page-subtitle">Embalaje de cajetas en cajas Master con QR para exportación</p>
    </div>
  </div>

  <div class="content-grid">
    <div class="card">
      <div class="card-header">
        <span class="step-number">1</span>
        <h2>Seleccionar Lote</h2>
      </div>
      <div class="form-group">
        <select class="form-input" [(ngModel)]="selectedLotId" (change)="onLotChange()">
          <option [value]="null">-- Seleccione --</option>
          <option *ngFor="let lot of receptions" [value]="lot.stockOrderId">
            Lote {{ lot.internalLotBase }} ({{ lot.shrimpType }})
          </option>
        </select>
      </div>
    </div>

    <div class="card" *ngIf="selectedLot">
      <div class="card-header">
        <span class="step-number">2</span>
        <h2>Crear Masters</h2>
      </div>

      <div class="master-form">
        <div class="form-group">
          <label>Marca</label>
          <input type="text" class="form-input" [(ngModel)]="brand" placeholder="Ej: SeaFresh">
        </div>
        <div class="form-group">
          <label>Talla</label>
          <select class="form-input" [(ngModel)]="shrimpSize">
            <option value="16/20">16/20</option>
            <option value="21/25">21/25</option>
            <option value="26/30">26/30</option>
            <option value="31/35">31/35</option>
            <option value="36/40">36/40</option>
            <option value="41/50">41/50</option>
            <option value="51/60">51/60</option>
          </select>
        </div>
        <div class="form-group">
          <label>Presentación</label>
          <select class="form-input" [(ngModel)]="presentation">
            <option value="2lb box">2 lb box</option>
            <option value="4lb box">4 lb box</option>
            <option value="5lb box">5 lb box</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo Congelación</label>
          <select class="form-input" [(ngModel)]="freezeType">
            <option value="BLOQUE">Bloque</option>
            <option value="IQF">IQF</option>
          </select>
        </div>
        <div class="form-group">
          <label>Peso bruto por master (lbs)</label>
          <input type="number" class="form-input" [(ngModel)]="grossWeightLbs" min="0.01" step="0.01">
        </div>
        <div class="form-group">
          <label>Cantidad de masters</label>
          <input type="number" class="form-input" [(ngModel)]="numMasters" min="1" max="100">
        </div>
      </div>

      <div *ngIf="errorMsg" style="color: #dc2626; margin-top: 0.5rem;">⚠️ {{ errorMsg }}</div>
      <div *ngIf="successMsg" style="color: #059669; margin-top: 0.5rem;">✅ {{ successMsg }}</div>

      <div style="margin-top: 24px; text-align: right;">
        <button class="btn-primary" [disabled]="!isValid() || saving" (click)="createMasters()">
          {{ saving ? '⏳ Creando...' : 'Empacar Masters' }}
        </button>
      </div>
    </div>

    <!-- Created masters list -->
    <div class="card" *ngIf="createdMasters.length > 0">
      <div class="card-header">
        <h2>Masters Creados</h2>
        <span class="badge-info">{{ createdMasters.length }}</span>
      </div>
      <ul class="master-list">
        <li *ngFor="let mc of createdMasters">
          <strong>{{ mc.brand }}</strong> — {{ mc.shrimpSize }} / {{ mc.presentation }}
          <span *ngIf="mc.qrCode" class="qr-tag">QR: {{ mc.qrCode }}</span>
        </li>
      </ul>
    </div>
  </div>
</div>
