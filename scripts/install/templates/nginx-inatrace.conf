# ==============================================================================
# nginx-inatrace.conf — Proxy Inverso Institucional TLS + Rate-Limiting + OIDC
# Reemplace '__DOMAIN_NAME__' por el dominio FQDN de su entidad.
# Requiere previamente: /etc/nginx/conf.d/inatrace-ratelimit.conf
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN_NAME__;
    return 301 https://$server_name$request_uri;
}

# En Nginx >= 1.25.1 puede usar 'listen 443 ssl;' junto con 'http2 on;'
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN_NAME__;

    # Redirección canónica: previene el error OIDC "Invalid parameter: redirect_uri"
    # cuando un usuario ingresa usando la IP pública o un alias DNS secundario.
    if ($host != $server_name) {
        return 301 https://$server_name$request_uri;
    }

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 100M;

    # 1. Gestión de Identidad Keycloak 26 (/auth/)
    location /auth/ {
        proxy_pass http://127.0.0.1:__KEYCLOAK_PORT__/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 2a. API Pública de Trazabilidad QR (protegida contra raspado masivo con HTTP 429)
    location /api/public/ {
        limit_req zone=inatrace_public burst=10 nodelay;
        limit_req_status 429;
        # Descubrimiento opcional AI-Ready QR para terminales aduaneras con soporte MCP:
        # add_header Link '<https://$server_name/mcp/sse>; rel="modelcontextprotocol"' always;
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2b. API Transaccional Autenticada (/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 90s;
    }

    # 3. Módulos Satélites Opcionales (descomentar si despliega BI Superset o Servidor MCP):
    # location /bi/ {
    #     proxy_pass http://127.0.0.1:8088/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    # }
    # location /mcp/ {
    #     proxy_pass http://127.0.0.1:8090/;
    #     proxy_http_version 1.1;
    #     proxy_buffering off;
    #     proxy_set_header Connection '';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto https;
    # }

    # 4. Aplicación Web Angular 19 (/)
    location / {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
